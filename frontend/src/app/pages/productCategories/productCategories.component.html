<div class="product-categories-container">

    <div *ngIf="isLoading">Loading...</div>
    <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

    <mat-toolbar style="margin-bottom: 15px">
        <span>Product Categories ({{ count }})</span>
        <span class="spacer"></span>
        <button
            color="primary" 
            mat-raised-button
            (click)="onCreate()">
            Create
        </button>
    </mat-toolbar>


    <table 
        mat-table 
        [dataSource]="dataSource"
        [formGroup]="form"
        class="mat-elevation-z8 mat-table-full-width">

        <!-- ID Column -->
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>
                Id
            </th>
            <td mat-cell *matCellDef="let row"> 
                {{ row.id }} 
            </td>
        </ng-container>

        <ng-container matColumnDef="filter-id">
            <th mat-header-cell *matHeaderCellDef>

            </th>
        </ng-container>


        <!-- Name Column -->
        <ng-container matColumnDef="name">
             <th mat-header-cell *matHeaderCellDef> 
                Name
            </th>
            <td mat-cell *matCellDef="let row"> 
                {{ row.name }} 
            </td>
        </ng-container>

        <ng-container matColumnDef="filter-name">
            <th mat-header-cell *matHeaderCellDef>
                <mat-form-field appearance="outline">
                    <input
                        matInput 
                        class="form-field" 
                        formControlName="name" 
                        placeholder="Name filter">
                </mat-form-field>
            </th>
        </ng-container>


        <!-- Active Column -->
        <ng-container matColumnDef="isActive">
            <th mat-header-cell *matHeaderCellDef> 
                Active
            </th>
            <td mat-cell *matCellDef="let row">
                <mat-icon color="primary" *ngIf="row.isActive">check_circle</mat-icon>
                <mat-icon color="warn" *ngIf="!row.isActive">cancel</mat-icon>
            </td>
        </ng-container>

        <ng-container matColumnDef="filter-isActive">
            <th mat-header-cell *matHeaderCellDef>
                <mat-form-field appearance="outline">
                    <mat-select formControlName="isActive">
                        <mat-option 
                            *ngFor="let option of checkboxFilterOptions"
                            [value]="option.value">
                            {{ option.label }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </th>
        </ng-container>

        <!-- Products Count Column -->
        <ng-container matColumnDef="productsCount">
            <th mat-header-cell *matHeaderCellDef>
                Products count
            </th>
            <td mat-cell *matCellDef="let row"> 
                {{ row.productsCount }} 
            </td>
        </ng-container>

        <ng-container matColumnDef="filter-productsCount">
            <th mat-header-cell *matHeaderCellDef>
                
            </th>
        </ng-container>

        <!-- Created At Column -->
        <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef> 
                Created at
            </th>
            <td mat-cell *matCellDef="let row"> 
                {{ row.createdAt | date:'short' }} 
            </td>
        </ng-container>

        <ng-container matColumnDef="filter-createdAt">
            <th mat-header-cell *matHeaderCellDef>
                
            </th>
        </ng-container>

        <!-- Updated At Column -->
        <ng-container matColumnDef="updatedAt">
            <th mat-header-cell *matHeaderCellDef> 
                Updated at
            </th>
            <td mat-cell *matCellDef="let row"> 
                {{ row.updatedAt | date:'short' }} 
            </td>
        </ng-container>

        <ng-container matColumnDef="filter-updatedAt">
            <th mat-header-cell *matHeaderCellDef>
                
            </th>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> 
                <button color="primary" mat-raised-button (click)="loadData()">Search</button>
            </th>
            <td mat-cell *matCellDef="let row"> 
                <button 
                    mat-mini-fab 
                    color="primary" 
                    [matMenuTriggerFor]="actionsMenu">
                    <mat-icon>menu</mat-icon>
                </button>

                <mat-menu #actionsMenu="matMenu">
                    <button mat-menu-item (click)="onUpdate(row)">
                        Update
                    </button>
                    <button mat-menu-item (click)="onDelete(row)">
                        Delete
                    </button>
                </mat-menu>
            </td>
        </ng-container>

        <ng-container matColumnDef="filter-actions">
            <th mat-header-cell *matHeaderCellDef>

            </th>
        </ng-container>

        <!-- Header and Row Declarations -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-header-row *matHeaderRowDef="filteredColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
