<div *ngIf="isLoading">Loading...</div>
<mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

<mat-toolbar style="margin-bottom: 10px !important">
    <span>{{ title }}</span>
    <span class="spacer"></span>
    <button 
        mat-raised-button
        (click)="onList()">
        Back to products
    </button>
    <button 
        mat-raised-button 
        color="primary" 
        [disabled]="form.invalid" 
        (click)="submit()">
        Submit
    </button>
</mat-toolbar>


<mat-card>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Price</mat-label>
      <input matInput type="number" formControlName="price" />
      <mat-error *ngIf="form.get('price')?.hasError('required')">
        Price is required
      </mat-error>
      <mat-error *ngIf="form.get('price')?.hasError('min')">
        Price must be at least 1
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category</mat-label>
      <mat-select formControlName="productCategory">
        <mat-option [value]="null">
            --
        </mat-option>
        <mat-option *ngFor="let option of categoryOptions" [value]="option">
          {{ option.value }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('productCategory')?.hasError('required')">
        Category is required
      </mat-error>
    </mat-form-field>
  </form>
</mat-card>


<div style="margin-top: 20px;" *ngIf="isEdit">
    <app-articlesForProduct 
        [productId]="id">
    </app-articlesForProduct>
</div>
